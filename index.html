<!DOCTYPE HTML>
<HTML>
	<HEAD>
		<TITLE>3D Game</TITLE>
		<LINK rel="stylesheet" href="style.css">
		<meta charset="utf-8">
	</HEAD>

	<BODY>
		<div id="container">
			<div id="hud">
				<div class="hud-item">Boquettes: <span id="coin-count">0</span></div>
				<div class="hud-item">Flower saplings: <span id="key-count">0</span></div>
			</div>

			<div id="world"></div>
			
			<div id="menu1" class="menu" style="display:block">
				<div id="button1" class="button">
					<p>Start game</p>
				</div>
				<div id="button2" class="button">
					<p>Instruction</p>
				</div>
			</div>
			
			<div id="menu2" class="menu">
				<p>
					<strong>Control</strong><br>
					w - Go Forward<br>
					s - Go Back<br>
					a - Go Left<br>
					d - Go Right<br>
					Space - Jump<br>
					You can use English keyboard only!!!
				</p>
				<div id="button3" class="button">
					<p>Back</p>
				</div>
			</div>

			<div id="menu3" class="menu">
				<p id="win-text">Bountiful harvest - pretty garden! Good work, game is over!</p>
				<div id="button4" class="button">
					<p>Play again</p>
				</div>
			</div>
		</div>
	</BODY>
</HTML>
<script src="script.js"></script>
